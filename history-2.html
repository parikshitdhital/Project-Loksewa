const root = document.getElementById('eras');
function renderEras(){
  const ne = I18N.lang === 'ne';
  const openIdx = Array.from(root.children).findIndex(c => c.classList.contains('open'));
  root.innerHTML = '';
  ERAS.forEach((era, i) => {
    const tx = (ne && ERAS_NE[i]) ? ERAS_NE[i] : era;
    const el = document.createElement('div');
    el.className = 'era-card';
    el.innerHTML = `
      <div class="era-banner" style="background:${era.gradient}">${era.icon}</div>
      <div class="era-body">
        <div class="era-head">
          <div class="era-title">${tx.title}</div>
          <div class="era-dates">${tx.dates}</div>
        </div>
        <div class="era-desc">${tx.desc}</div>
        <div class="era-detail"><div class="era-detail-inner">${tx.detail}${era.page ? `<a class="era-more" href="${era.page}" onclick="event.stopPropagation()">${I18N.t('hist_more')}</a>` : ''}</div></div>
        <div class="era-chev">▾</div>
      </div>
    `;
    el.addEventListener('click', () => {
      const willOpen = !el.classList.contains('open');
      document.querySelectorAll('.era-card.open').forEach(c => c.classList.remove('open'));
      if(willOpen) el.classList.add('open');
    });
    if(i === openIdx) el.classList.add('open');
    root.appendChild(el);
  });
}
renderEras();
document.addEventListener('langchange', renderEras);
</script>
